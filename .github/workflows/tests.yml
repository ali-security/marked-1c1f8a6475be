name: "Tests"
on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  Test:
    # Single Node 16 leg. The declared Node 8 leg is dropped: the pinned dev
    # toolchain requires newer Node (rollup@2.49.0 needs node >=10 and
    # eslint@7.27.0 needs >=10.12), so a Node 8 leg hard-fails at install
    # before any test runs, and Node 8 is no longer provisionable on current
    # runners.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        run: npm run test:unit
      - name: Run Spec Tests 👩🏽‍💻
        run: npm run test:specs

  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: Install Dependencies
        run: npm ci
      - name: Build 🗜️
        run: npm run build
      - name: Pack 📦
        run: npm pack
      - name: Upload Artifact ⬆️
        uses: actions/upload-artifact@v4
        with:
          name: marked-tgz
          path: marked-*.tgz
          if-no-files-found: error
